services:
  keycloak-db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - keycloak-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - keycloak-dados

  keycloak:
    image: pluvia/keycloak:local
    build: .
    command: ["start", "--optimized", "--import-realm"]
    env_file: .env
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./realm/pluvia-realm.json:/opt/keycloak/data/import/pluvia-realm.json:ro
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r status <&3
          [[ "$status" == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    networks:
      - aplicacao
      - keycloak-dados

volumes:
  keycloak-db-dados:

networks:
  aplicacao:
  keycloak-dados:
