services:
  ollama:
    image: ollama/ollama:0.40.15
    # Memória: o contexto fica em 4096 tokens (o prompt do RAG usa ~900) e o cache
    # de contexto é quantizado em 8 bits. Os dois modelos ficam carregados juntos:
    # alternar entre eles a cada pergunta custa ~1,5 s de recarga.
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - llm

  # Baixa os modelos para o volume na primeira subida e termina. Nas seguintes,
  # o pull só confere que estão atualizados. Os nomes vêm de services/analise/llm.env.
  ollama-modelos:
    image: ollama/ollama:0.40.15
    env_file: ../../services/analise/llm.env
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$LLM_MODELO\" && ollama pull \"$$EMBEDDING_MODELO\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - llm

volumes:
  ollama-modelos:

networks:
  llm:
