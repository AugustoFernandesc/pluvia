apiVersion: v1
kind: Service
metadata:
  name: risco-leitura-db
  labels:
    app.kubernetes.io/name: risco-leitura-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: risco-leitura-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: risco-leitura-db
  labels:
    app.kubernetes.io/name: risco-leitura-db
spec:
  serviceName: risco-leitura-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risco-leitura-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risco-leitura-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          # O ConfigMap e o Secret do Risco têm as variáveis dos dois bancos,
          # com prefixo. Aqui elas viram as variáveis padrão da imagem do Postgres.
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: risco-config
                  key: POSTGRES_LEITURA_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: risco-config
                  key: POSTGRES_LEITURA_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: risco-secret
                  key: POSTGRES_LEITURA_PASSWORD
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: risco-config
                  key: PGDATA
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
