apiVersion: apps/v1
kind: Deployment
metadata:
  name: risco
  labels:
    app.kubernetes.io/name: risco
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risco
    spec:
      containers:
        - name: risco
          image: pluvia-risco:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: risco-config
            - secretRef:
                name: risco-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
