apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.40.15
          ports:
            - name: http
              containerPort: 11434
          # Ao subir, baixa os modelos que a Análise usa (os nomes vêm do mesmo
          # ConfigMap). Enquanto isso, as consultas caem no fallback.
          envFrom:
            - configMapRef:
                name: analise-config
          env:
            - name: OLLAMA_CONTEXT_LENGTH
              value: "4096"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - (until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$LLM_MODELO"; ollama pull "$EMBEDDING_MODELO") >/tmp/pull.log 2>&1 &
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 5Gi
          volumeMounts:
            - name: modelos
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: modelos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
