apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      initContainers:
        - name: render-kong-config
          image: python:3.14-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/source/bootstrap-kong.py"]
          args:
            - --template
            - /source/kong.yml.template
            - --renderer
            - /source/render-kong.py
            - --output
            - /rendered/kong.yml
            - --public-key-file
            - /keycloak-key/realm-public-key.pem
            - --timeout-seconds
            - "180"
          envFrom:
            - configMapRef:
                name: kong-config
          volumeMounts:
            - name: kong-source
              mountPath: /source
              readOnly: true
            - name: keycloak-key
              mountPath: /keycloak-key
              readOnly: true
            - name: rendered-config
              mountPath: /rendered
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: kong
          image: pluvia/kong:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/rendered/kong.yml
            - name: KONG_ADMIN_LISTEN
              value: "off"
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/kong/rendered
              readOnly: true
          startupProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["kong", "health"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: kong-source
          configMap:
            name: kong-source
            defaultMode: 0444
        - name: keycloak-key
          secret:
            secretName: keycloak-jwt-public-key
            defaultMode: 0444
        - name: rendered-config
          emptyDir: {}
