apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - db.yaml

secretGenerator:
  - name: analise-secret
    envs:
      - secret.env

# Mesmo conteúdo de services/analise/db/init/01-pgvector.sql. O Kustomize não lê
# arquivos fora desta pasta, por isso o SQL vai como literal.
configMapGenerator:
  - name: analise-db-init
    literals:
      - 01-pgvector.sql=CREATE EXTENSION IF NOT EXISTS vector;
