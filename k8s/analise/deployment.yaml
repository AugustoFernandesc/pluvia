apiVersion: apps/v1
kind: Deployment
metadata:
  name: analise
  labels:
    app.kubernetes.io/name: analise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analise
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analise
    spec:
      containers:
        - name: analise
          image: pluvia-analise:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: analise-config
            - secretRef:
                name: analise-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # O /health espera até 3 s pelo banco antes de responder 503.
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
