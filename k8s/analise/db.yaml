apiVersion: v1
kind: Service
metadata:
  name: analise-db
  labels:
    app.kubernetes.io/name: analise-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: analise-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: analise-db
  labels:
    app.kubernetes.io/name: analise-db
spec:
  serviceName: analise-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analise-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analise-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: analise-config
            - secretRef:
                name: analise-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            # Habilita o pgvector na criação do banco, como o db/init do compose.
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: analise-db-init
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
