apiVersion: apps/v1
kind: Deployment
metadata:
  name: territorio
  labels:
    app.kubernetes.io/name: territorio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: territorio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: territorio
    spec:
      containers:
        - name: territorio
          image: pluvia-territorio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: territorio-config
            - secretRef:
                name: territorio-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
