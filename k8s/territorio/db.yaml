apiVersion: v1
kind: Service
metadata:
  name: territorio-db
  labels:
    app.kubernetes.io/name: territorio-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: territorio-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: territorio-db
  labels:
    app.kubernetes.io/name: territorio-db
spec:
  serviceName: territorio-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: territorio-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: territorio-db
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: territorio-config
            - secretRef:
                name: territorio-secret
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
