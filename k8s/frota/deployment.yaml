apiVersion: apps/v1
kind: Deployment
metadata:
  name: frota
  labels:
    app.kubernetes.io/name: frota
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frota
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frota
    spec:
      containers:
        - name: frota
          image: pluvia-frota:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: frota-config
            - secretRef:
                name: frota-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
