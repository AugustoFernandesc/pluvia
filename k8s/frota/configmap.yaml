apiVersion: v1
kind: ConfigMap
metadata:
  name: frota-config
  labels:
    app.kubernetes.io/name: frota
data:
  PORT: "3000"
  POSTGRES_HOST: frota-db
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: pluvia
  POSTGRES_DB: frota
  POSTGRES_USER: frota
  PGDATA: /var/lib/postgresql/data/pgdata
