apiVersion: v1
kind: ConfigMap
metadata:
  name: equipes-config
  labels:
    app.kubernetes.io/name: equipes
data:
  PORT: "3000"
  POSTGRES_HOST: equipes-db
  POSTGRES_PORT: "5432"
