apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipes
  labels:
    app.kubernetes.io/name: equipes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: equipes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: equipes
    spec:
      containers:
        - name: equipes
          image: pluvia-equipes:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: equipes-config
            - secretRef:
                name: equipes-secret
          # Usuário e senha do RabbitMQ vêm do Secret do próprio broker, para
          # não existir uma segunda cópia da senha que possa ficar diferente.
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_SERVICOS_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_SERVICOS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
