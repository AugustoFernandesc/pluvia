openapi: 3.0.3
info:
  title: Pluvia · BFF Mobile
  version: 1.0.0
  description: |
    Backend do app mobile. Respostas enxutas, com texto pronto para exibição.
    Rotas sob /publico dispensam autenticação e atendem a comunidade.
    As demais exigem JWT com papel AGENTE.
servers:
  - url: https://api.pluvia.local/mobile/v1
    description: Acesso externo, pelo gateway
tags:
  - name: Publico
  - name: Agente

paths:
  /publico/regioes/localizar:
    get:
      tags: [Publico]
      operationId: localizarRegiaoMobile
      summary: Descobre a região a partir da localização do aparelho
      security: []
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        '200':
          description: Região encontrada
          content:
            application/json:
              schema:
                type: object
                required: [regiaoId, nome]
                properties:
                  regiaoId: { type: string, format: uuid }
                  nome: { type: string }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /publico/regioes/{regiaoId}/resumo:
    get:
      tags: [Publico]
      operationId: obterResumoRegiao
      summary: Resumo da região em linguagem simples
      security: []
      parameters:
        - { name: regiaoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumo
          headers:
            ETag:
              description: Permite ao app revalidar o cache com If-None-Match
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoRegiao' }
        '304':
          description: Resumo não mudou desde a última consulta
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
        '503': { $ref: '#/components/responses/Indisponivel' }

  /minhas-acoes:
    get:
      tags: [Agente]
      operationId: listarMinhasAcoes
      summary: Ações atribuídas à equipe do agente
      security:
        - bearer: []
      parameters:
        - { name: periodo, in: query, schema: { type: string, enum: [HOJE, SEMANA], default: HOJE } }
      responses:
        '200':
          description: Ações do agente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AcaoResumida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '503': { $ref: '#/components/responses/Indisponivel' }

  /acoes/{acaoId}:
    get:
      tags: [Agente]
      operationId: obterAcaoMobile
      summary: Ação com apenas os links que o agente pode executar
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/AcaoId'
      responses:
        '200':
          description: Ação
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AcaoResumida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /acoes/{acaoId}/inicio:
    post:
      tags: [Agente]
      operationId: iniciarAcaoMobile
      summary: Registra início da execução em campo
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/AcaoId'
      responses:
        '200':
          description: Ação em execução
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AcaoResumida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '409': { $ref: '#/components/responses/Conflito' }

  /acoes/{acaoId}/conclusao:
    post:
      tags: [Agente]
      operationId: concluirAcaoMobile
      summary: Conclui a ação com o resultado observado
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/AcaoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resultado]
              properties:
                resultado: { type: string, minLength: 10 }
      responses:
        '200':
          description: Ação concluída
          content:
            application/hal+json:
              schema: { $ref: '#/components/schemas/AcaoResumida' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/Proibido' }
        '409': { $ref: '#/components/responses/Conflito' }

  /ocorrencias:
    post:
      tags: [Agente]
      operationId: reportarOcorrenciaMobile
      summary: Reporta ocorrência observada em campo
      description: A localização vem do GPS do aparelho. A região é determinada por Território.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, lat, lng]
              properties:
                tipo: { type: string, enum: [ALAGAMENTO, ENXURRADA, INUNDACAO] }
                lat: { type: number }
                lng: { type: number }
                descricao: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Ocorrência registrada, aguardando validação técnica
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  mensagem: { type: string, example: Obrigado. A equipe técnica vai avaliar o registro. }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes:
    get:
      tags: [Agente]
      operationId: listarNotificacoesMobile
      summary: Alertas operacionais do agente
      security:
        - bearer: []
      responses:
        '200':
          description: Notificações
          content:
            application/json:
              schema:
                type: object
                properties:
                  naoLidas: { type: integer }
                  itens:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        titulo: { type: string }
                        mensagem: { type: string }
                        quando: { type: string, example: há 12 min }
                        lida: { type: boolean }
        '401': { $ref: '#/components/responses/NaoAutenticado' }

  /notificacoes/{notificacaoId}/leitura:
    post:
      tags: [Agente]
      operationId: lerNotificacaoMobile
      summary: Marca notificação como lida
      security:
        - bearer: []
      parameters:
        - { name: notificacaoId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Notificação lida
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AcaoId:
      name: acaoId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NaoAutenticado:
      description: JWT ausente, inválido ou expirado; resposta emitida pelo gateway antes de alcançar o BFF
      content:
        application/json:
          schema:
            type: object
            description: Corpo nativo do plugin jwt do Kong, com mensagem ou erros de claims
            additionalProperties: true
            properties:
              message: { type: string }
              exp: { type: string }
          examples:
            tokenAusente:
              value: { message: Unauthorized }
    Proibido:
      description: A ação não pertence à equipe do agente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrado:
      description: Recurso inexistente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Conflito:
      description: Transição inválida para o estado atual
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    LimiteExcedido:
      description: Limite de requisições excedido, emitido pelo gateway
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    Indisponivel:
      description: Serviço de origem indisponível
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Problema:
      type: object
      required: [title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    ResumoRegiao:
      type: object
      required: [regiao, nivel, rotulo, cor, mensagem, atualizadoEm]
      properties:
        regiao: { type: string, example: Centro }
        nivel: { type: string, enum: [NORMAL, OBSERVACAO, ATENCAO, ALTA_ATENCAO] }
        rotulo: { type: string, example: Atenção }
        cor: { type: string, example: '#F59E0B' }
        mensagem:
          type: string
          example: Chuva acima do normal nos últimos dias e mais chuva prevista para amanhã. A prefeitura está acompanhando a região.
        proximosDias:
          type: array
          items:
            type: object
            properties:
              dia: { type: string, format: date }
              chuvaPrevista: { type: string, enum: [nenhuma, fraca, moderada, forte] }
        atualizadoEm: { type: string, format: date-time }

    Link:
      type: object
      required: [href]
      properties:
        href: { type: string }
        method: { type: string, enum: [GET, POST] }

    AcaoResumida:
      type: object
      required: [id, titulo, quando, estado, _links]
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, example: Limpeza de drenagem · Centro }
        quando: { type: string, example: '20/10, manhã' }
        estado: { type: string, enum: [CONFIRMADA, EM_EXECUCAO, CONCLUIDA, CANCELADA] }
        _links:
          type: object
          required: [self]
          description: Apenas links executáveis pelo agente. O link cancelar nunca é repassado
          properties:
            self: { $ref: '#/components/schemas/Link' }
            iniciar: { $ref: '#/components/schemas/Link' }
            concluir: { $ref: '#/components/schemas/Link' }
