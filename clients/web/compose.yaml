services:
  pluvia-web:
    image: pluvia/web:local
    build: .
    ports:
      - "5173:80"
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - aplicacao

networks:
  aplicacao:
